<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="450" viewBox="0 0 1600 450" role="img" aria-labelledby="title desc"><title id="title">四步完成局部改图</title><desc id="desc">框选读取、填写要求和参考、选择模型生成、选择结果添加图层。</desc><rect width="1600" height="450" fill="#141b27"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="52" y="66" font-size="36" fill="#eaf0fa" font-weight="600">从选区到图层，只需四步</text><text x="52" y="105" font-size="21" fill="#9eafc5" font-weight="400">保留原画面，在熟悉的 Photoshop 工作流里完成修改</text><rect x="52" y="150" width="338" height="242" rx="18" fill="#232c3b" stroke="#35445b"/><text x="76" y="202" font-size="34" fill="#73b3ff" font-weight="600">01</text><text x="76" y="251" font-size="26" fill="#eaf0fa" font-weight="600">框选并读取</text><text x="76" y="302" font-size="20" fill="#b3c0d3" font-weight="400">用框选或套索选中区域</text><text x="76" y="337" font-size="18" fill="#9eafc5" font-weight="400">点击「读取选区」</text><path d="M403 269h22m-9-9 9 9-9 9" fill="none" stroke="#73b3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="438" y="150" width="338" height="242" rx="18" fill="#232c3b" stroke="#35445b"/><text x="462" y="202" font-size="34" fill="#73b3ff" font-weight="600">02</text><text x="462" y="251" font-size="26" fill="#eaf0fa" font-weight="600">描述修改要求</text><text x="462" y="302" font-size="20" fill="#b3c0d3" font-weight="400">填写内容，按需添加参考图</text><text x="462" y="337" font-size="18" fill="#9eafc5" font-weight="400">支持风格、人物或物品参考</text><path d="M789 269h22m-9-9 9 9-9 9" fill="none" stroke="#73b3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="824" y="150" width="338" height="242" rx="18" fill="#232c3b" stroke="#35445b"/><text x="848" y="202" font-size="34" fill="#73b3ff" font-weight="600">03</text><text x="848" y="251" font-size="26" fill="#eaf0fa" font-weight="600">选择模型并生成</text><text x="848" y="302" font-size="20" fill="#b3c0d3" font-weight="400">选择可用清晰度与比例</text><text x="848" y="337" font-size="18" fill="#9eafc5" font-weight="400">生成期间可新建其他选区</text><path d="M1175 269h22m-9-9 9 9-9 9" fill="none" stroke="#73b3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1210" y="150" width="338" height="242" rx="18" fill="#232c3b" stroke="#35445b"/><text x="1234" y="202" font-size="34" fill="#73b3ff" font-weight="600">04</text><text x="1234" y="251" font-size="26" fill="#eaf0fa" font-weight="600">把结果添加为图层</text><text x="1234" y="302" font-size="20" fill="#b3c0d3" font-weight="400">预览候选图，点击添加</text><text x="1234" y="337" font-size="18" fill="#9eafc5" font-weight="400">按原坐标回填，保留选区蒙版</text></g></svg>