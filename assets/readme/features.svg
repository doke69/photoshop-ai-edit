<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc"><title id="title">插件功能亮点</title><desc id="desc">模型同步和参数适配、自动压缩、多选区后台任务、历史恢复、参考图和图层回填。</desc><rect width="1600" height="650" fill="#141b27"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="52" y="68" font-size="36" fill="#eaf0fa" font-weight="600">为局部修改，减少重复操作</text><text x="52" y="106" font-size="21" fill="#9eafc5" font-weight="400">v0.4.2 功能概览 · 安装包支持 OpenUXP</text><rect x="52" y="150" width="476" height="188" rx="18" fill="#232c3b" stroke="#35445b"/><rect x="74" y="172" width="6" height="35" rx="3" fill="#73b3ff" stroke="none"/><text x="97" y="199" font-size="27" fill="#eaf0fa" font-weight="600">模型同步与收藏</text><text x="76" y="250" font-size="21" fill="#b3c0d3" font-weight="400">从 LK888 同步可用模型目录</text><text x="76" y="286" font-size="19" fill="#9eafc5" font-weight="400">搜索、收藏，按模型匹配参数</text><rect x="562" y="150" width="476" height="188" rx="18" fill="#232c3b" stroke="#35445b"/><rect x="584" y="172" width="6" height="35" rx="3" fill="#73b3ff" stroke="none"/><text x="607" y="199" font-size="27" fill="#eaf0fa" font-weight="600">选区自动压缩</text><text x="586" y="250" font-size="21" fill="#b3c0d3" font-weight="400">先进行 PNG 无损压缩</text><text x="586" y="286" font-size="19" fill="#9eafc5" font-weight="400">超限等比缩小，显示上传大小</text><rect x="1072" y="150" width="476" height="188" rx="18" fill="#232c3b" stroke="#35445b"/><rect x="1094" y="172" width="6" height="35" rx="3" fill="#73b3ff" stroke="none"/><text x="1117" y="199" font-size="27" fill="#eaf0fa" font-weight="600">多选区后台任务</text><text x="1096" y="250" font-size="21" fill="#b3c0d3" font-weight="400">不同区域独立标签与状态</text><text x="1096" y="286" font-size="19" fill="#9eafc5" font-weight="400">当前任务生成时继续新建选区</text><rect x="52" y="369" width="476" height="188" rx="18" fill="#232c3b" stroke="#35445b"/><rect x="74" y="391" width="6" height="35" rx="3" fill="#73b3ff" stroke="none"/><text x="97" y="418" font-size="27" fill="#eaf0fa" font-weight="600">输入与历史恢复</text><text x="76" y="469" font-size="21" fill="#b3c0d3" font-weight="400">保留提示词、图片与参数</text><text x="76" y="505" font-size="19" fill="#9eafc5" font-weight="400">关闭标签后仍可在历史中恢复</text><rect x="562" y="369" width="476" height="188" rx="18" fill="#232c3b" stroke="#35445b"/><rect x="584" y="391" width="6" height="35" rx="3" fill="#73b3ff" stroke="none"/><text x="607" y="418" font-size="27" fill="#eaf0fa" font-weight="600">参考图与标注</text><text x="586" y="469" font-size="21" fill="#b3c0d3" font-weight="400">补充风格、人物和物品参考</text><text x="586" y="505" font-size="19" fill="#9eafc5" font-weight="400">部分辅助功能需 Windows 助手</text><rect x="1072" y="369" width="476" height="188" rx="18" fill="#232c3b" stroke="#35445b"/><rect x="1094" y="391" width="6" height="35" rx="3" fill="#73b3ff" stroke="none"/><text x="1117" y="418" font-size="27" fill="#eaf0fa" font-weight="600">候选结果独立回填</text><text x="1096" y="469" font-size="21" fill="#b3c0d3" font-weight="400">放大、保存或反复添加图层</text><text x="1096" y="505" font-size="19" fill="#9eafc5" font-weight="400">原坐标与选区蒙版限制回填范围</text><text x="52" y="622" font-size="18" fill="#889bb6" font-weight="400">外部参考图超限需自行缩小；Mac 使用系统听写帮助。</text></g></svg>